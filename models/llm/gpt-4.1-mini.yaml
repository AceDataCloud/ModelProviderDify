model: gpt-4.1-mini
label:
  en_US: GPT-4.1 mini
  zh_Hans: GPT-4.1 mini
model_type: llm
features: []
model_properties:
  mode: chat
  context_size: 128000
parameter_rules:
  - name: temperature
    use_template: temperature
  - name: top_p
    use_template: top_p
  - name: presence_penalty
    use_template: presence_penalty
  - name: frequency_penalty
    use_template: frequency_penalty
  - name: max_tokens
    use_template: max_tokens
    default: 1024
    min: 1
    max: 1024
