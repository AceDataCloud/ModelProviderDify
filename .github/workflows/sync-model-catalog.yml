name: Sync published model catalog

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest ruff
      - name: Read public metadata and regenerate every model
        id: catalog
        run: |
          python scripts/sync_model_catalog.py --refresh
          if git diff --quiet -- models; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            python - <<'PY'
          from pathlib import Path
          import re
          path = Path('manifest.yaml')
          text = path.read_text()
          text = re.sub(r'^version: (\d+)\.(\d+)\.(\d+)$', lambda m: f'version: {m[1]}.{m[2]}.{int(m[3]) + 1}', text, count=1, flags=re.M)
          path.write_text(text)
          PY
          fi
      - name: Validate complete generated declarations
        if: steps.catalog.outputs.changed == 'true'
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest tests -q
          ruff check .
          ruff format --check .
      - name: Open a bot PR for the new catalog
        if: steps.catalog.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api user --jq .login)" = 'acedatacloud-dev'
          CATALOG_HASH=$(sha256sum models/catalog.json | cut -c 1-12)
          CATALOG_BRANCH="automation/model-catalog-$CATALOG_HASH"
          OPEN_PR=$(gh pr list --repo "$GH_REPO" --head "$CATALOG_BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -n "$OPEN_PR" ]; then
            echo "This catalog already has an open PR: $OPEN_PR"
            exit 0
          fi
          if gh api "repos/$GH_REPO/git/ref/heads/$CATALOG_BRANCH" >/dev/null 2>&1; then
            CATALOG_BRANCH="$CATALOG_BRANCH-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          git switch -c "$CATALOG_BRANCH"
          git config user.name 'Ace Data Cloud Dev'
          git config user.email 'dev@acedata.cloud'
          git add models manifest.yaml
          git commit -m 'Update the complete published model catalog'
          gh auth setup-git
          git push origin "HEAD:refs/heads/$CATALOG_BRANCH"
          cat > /tmp/catalog-pr.md <<'EOF'
          Refresh every chat, embedding and audio model from the public typed Ace Data Cloud catalog. The generated declaration includes each published ID rather than a curated subset. The plugin version is incremented for the next Marketplace submission.

          Validation: normal pytest discovery, complete generated-file parity, Ruff lint and format. Only public metadata was read; no credentials or paid inference were used. Source review and official Marketplace publication remain required before installed workspaces receive this update.
          EOF
          gh pr create --repo "$GH_REPO" --base main --head "$CATALOG_BRANCH" --title 'Refresh the complete published model catalog' --body-file /tmp/catalog-pr.md
